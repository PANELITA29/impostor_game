<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Visor Neon Glass Gradient -->
    <linearGradient id="visor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFF" />
      <stop offset="25%" stop-color="#38E8FF" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <!-- Visor Glass Highlight Arc -->
    <linearGradient id="visor-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Impostor Body Neon Gradient -->
    <linearGradient id="body-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Glove / Hand Gradient -->
    <linearGradient id="hand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="70%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>
  </defs>

  <!-- Backpack (Left Tank) -->
  <path
    d="M 95 145 C 75 145 60 160 60 185 L 60 270 C 60 295 75 310 95 310 L 115 310 L 115 145 Z"
    fill="url(#body-grad)"
    stroke="#05070A"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Main Body Silhouette (Bean Shape) -->
  <path
    d="M 115 315 L 115 140 C 115 65 285 65 285 140 L 285 315 C 285 342 258 342 245 315 L 210 315 C 200 342 165 342 155 315 L 125 315 C 120 315 115 315 115 315 Z"
    fill="url(#body-grad)"
    stroke="#05070A"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Visor Dark Outer Frame -->
  <path
    d="M 148 120 C 148 96 280 96 280 120 C 290 148 290 180 280 202 C 275 220 148 220 148 202 C 140 180 140 148 148 120 Z"
    fill="#05070A"
    stroke="#05070A"
    stroke-width="6"
  />

  <!-- Visor Glass Surface -->
  <path
    d="M 155 125 C 158 108 270 108 273 125 C 281 148 281 176 273 194 C 268 210 158 210 155 194 C 148 176 148 148 155 125 Z"
    fill="url(#visor-grad)"
  />

  <!-- Visor Top Glass Reflection Pill -->
  <path
    d="M 166 128 C 172 118 256 118 262 128 C 255 138 175 138 166 128 Z"
    fill="url(#visor-highlight)"
  />

  <!-- Shushing Hand (The Iconic Impostor Finger: "SHHHHH") -->
  <g id="shush-hand">
    <!-- Hand Base / Fist -->
    <path
      d="M 166 265 C 155 265 148 275 148 290 C 148 312 162 328 185 328 L 225 328 C 248 328 260 312 260 290 C 260 272 250 262 235 262 L 220 262 L 220 130 C 220 110 188 110 188 130 L 188 265 Z"
      fill="url(#hand-grad)"
      stroke="#05070A"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upright Shushing Index Finger Specular Edge -->
    <path
      d="M 194 130 L 194 250"
      stroke="#FFA3B5"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Finger Knuckle / Fold Crease Lines -->
    <path
      d="M 162 292 C 175 298 185 298 190 292"
      stroke="#05070A"
      stroke-width="5"
      stroke-linecap="round"
    />
    <path
      d="M 215 288 C 225 295 238 295 246 288"
      stroke="#05070A"
      stroke-width="5"
      stroke-linecap="round"
    />
    <path
      d="M 192 195 C 198 198 206 198 212 195"
      stroke="#05070A"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>
</svg>

